name: Array Sum
workflow: unicon/classic@v6
environment:
  python:
    packages: [numpy>=2.3]
inputs:
  code: entrant
  language: {entrant: {options: [python], default: python}}
  time_limit: 2
  memory_limit: 256
repeat:
  - inputs: [input, answer]
    tuples:
      - [tests/1.in, tests/1.ans]
scoring:
  values:
    points: {block: mul, of: [100, {block: sum, over: {runs: all}, of: {run: [all, score]}}]}
  show:
    always:
      values: [points]
      outputs: [log, compiled]
      runs:
        - {of: all, fields: [verdict, passed, score, time_ms, memory_kb, label, message]}
submissions: {rate: {count: 10, per: 60}}
