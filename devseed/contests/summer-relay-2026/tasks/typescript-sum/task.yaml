name: TypeScript Sum
workflow: unicon/classic@v6
environment:
  typescript:
    packages: [chai@6, "@types/chai@5", "@types/node@26"]
inputs:
  code: entrant
  language: {entrant: {options: [typescript], default: typescript}}
  time_limit: 2
  memory_limit: 256
repeat:
  - inputs: [input, answer]
    tuples:
      - [tests/1.in, tests/1.ans]
      - [tests/2.in, tests/2.ans]
scoring:
  values:
    points: {block: mul, of: [50, {block: sum, over: {runs: all}, of: {run: [all, score]}}]}
  show:
    always:
      values: [points]
      outputs: [log, compiled]
      runs:
        - {of: all, fields: [verdict, passed, score, time_ms, memory_kb, label, message]}
submissions: {rate: {count: 10, per: 60}}
