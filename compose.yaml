# The Unicon stack. Production shape: every third-party image is pinned by its
# release tag, the backend and the frontend follow their repositories' main,
# and nothing is built here. compose.dev.yaml overrides this for local work.
#
# Values come from .env, which `uv run bootstrap` writes. Keys marked `:?` have
# no sensible default and stop compose with a named variable rather than
# starting a service with an empty password.
name: unicon

# The backend's environment, in one place because two services need it: only
# the backend's own keys, not the whole of .env, so nothing here carries the
# Forgejo administrator password or the Garage RPC secret. The addresses of the
# other services on the compose network, the bucket names and the account
# bootstrap makes are written here as they are; the rest comes from .env.
# Plain ${...} rather than ${...:?}, because compose interpolates every service
# on every command and bootstrap has to start Postgres before these exist. The
# backend checks them at boot and refuses to start on a missing one.
x-backend-env: &backend-env
  # The backend marks its cookies Secure exactly when this is https.
  UNICON_PUBLIC_URL: ${UNICON_PUBLIC_URL}
  UNICON_DATABASE_URL: &database-url postgresql+psycopg://unicon:${UNICON_DB_PASSWORD}@postgres:5432/unicon
  # The backend sends people to the same Forgejo their browser uses, and
  # reaches it itself over the compose network.
  UNICON_FORGE_PUBLIC_URL: ${FORGEJO_PUBLIC_URL}
  UNICON_FORGE_INTERNAL_URL: http://forgejo:3000
  # The backend's own address inside the stack, where the forge's org event
  # push is aimed. forgejo/app.ini allows the host `backend` for it.
  UNICON_INTERNAL_URL: http://backend:8000
  UNICON_FORGE_ADMIN_TOKEN: ${UNICON_FORGE_ADMIN_TOKEN}
  # The account bootstrap makes and the admin token belongs to, the one
  # account protected tags are reserved for.
  UNICON_FORGE_PLATFORM_ACCOUNT: unicon-backend
  UNICON_FORGE_OAUTH_CLIENT_ID: ${UNICON_FORGE_OAUTH_CLIENT_ID}
  UNICON_FORGE_OAUTH_CLIENT_SECRET: ${UNICON_FORGE_OAUTH_CLIENT_SECRET}
  UNICON_WOODPECKER_URL: http://woodpecker-server:8000
  # The URL the CI knows itself by. It writes its webhooks under it, and the
  # backend tells the CI's webhook from any other by it.
  UNICON_WOODPECKER_PUBLIC_URL: ${WOODPECKER_PUBLIC_URL}
  UNICON_WOODPECKER_TOKEN: ${UNICON_WOODPECKER_TOKEN}
  UNICON_SESSION_SIGNING_KEY: ${UNICON_SESSION_SIGNING_KEY}
  UNICON_TOKEN_ENCRYPTION_KEY: ${UNICON_TOKEN_ENCRYPTION_KEY}
  # Seconds. Forgejo's refresh token lives as long, from the same key: see
  # FORGEJO__oauth2__REFRESH_TOKEN_EXPIRATION_TIME below.
  UNICON_SESSION_HARD_TTL: ${UNICON_SESSION_HARD_TTL}
  # Whether the landing page offers Create account. Bootstrap writes it from
  # SIGN_UP_OPEN, beside Forgejo's own switch, so the two agree.
  UNICON_FORGE_REGISTRATION_OPEN: ${UNICON_FORGE_REGISTRATION_OPEN:-false}
  # Any signed-in person may create an org. A deployment open to strangers
  # turns it off and creates orgs with `unicon create-org`.
  UNICON_ORG_CREATION_OPEN: ${UNICON_ORG_CREATION_OPEN:-true}
  # Object storage: Garage inside the network, in the region garage/garage.toml
  # names, the access key bootstrap made for the backend, and the two buckets
  # bootstrap makes. What a browser uploads before a submit goes to the first,
  # the grading logs to the second, both through presigned URLs the proxy
  # passes to Garage untouched.
  UNICON_S3_ENDPOINT: http://garage:3900
  UNICON_S3_REGION: garage
  UNICON_S3_ACCESS_KEY: ${UNICON_S3_ACCESS_KEY}
  UNICON_S3_SECRET_KEY: ${UNICON_S3_SECRET_KEY}
  UNICON_S3_RESULTS_BUCKET: unicon-results
  # Where a grading machine reaches the platform: the envelope, the callback
  # and the log upload. The public URL unless .env says otherwise;
  # compose.dev.yaml points it at the proxy's name on this network, which the
  # dev agent's steps join.
  UNICON_MACHINE_URL: ${UNICON_MACHINE_URL:-${UNICON_PUBLIC_URL}}
  # The harness every plan runs, and the image the CI checks the task and the
  # submission out with, both by digest from the image manifest (images.json).
  UNICON_HARNESS_IMAGE: ${UNICON_HARNESS_IMAGE}
  UNICON_CLONE_IMAGE: ${UNICON_CLONE_IMAGE}

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set by bootstrap}
      POSTGRES_DB: postgres
      # Read by postgres/init/10-create-databases.sh on the first start.
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD:?set by bootstrap}
      WOODPECKER_DB_PASSWORD: ${WOODPECKER_DB_PASSWORD:?set by bootstrap}
      UNICON_DB_PASSWORD: ${UNICON_DB_PASSWORD:?set by bootstrap}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, not the socket. The entrypoint runs a temporary server on the
      # socket only while it applies postgres/init, so a socket check reports
      # healthy before the three roles exist and everything that waits on
      # service_healthy starts too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Forgejo asks Garage whether the LFS bucket exists while it boots, so a
      # plain `up -d` after a reboot must not race it.
      garage:
        condition: service_healthy
    # forgejo/app.ini is the record. Copying it into place on every start means
    # a hand edit inside a running container is reverted by the next restart.
    # The setup step of the image then merges the FORGEJO__* variables below
    # into that copy, so secrets stay out of the committed file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/gitea/conf
        cp /etc/unicon/forgejo/app.ini /data/gitea/conf/app.ini
        chown 1000:1000 /data/gitea/conf/app.ini
        chmod 0640 /data/gitea/conf/app.ini
        exec /usr/bin/entrypoint /usr/bin/s6-svscan /etc/s6
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # The browser-facing URL: Forgejo's own hostname on the proxy, where
      # people sign in and keep their account. Not the in-network address.
      FORGEJO__server__ROOT_URL: ${FORGEJO_PUBLIC_URL:?set by bootstrap}/
      # The host out of that URL. Bootstrap derives it, so the two cannot drift.
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:?set by bootstrap}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?set by bootstrap}
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?set by bootstrap}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN:?set by bootstrap}
      FORGEJO__oauth2__JWT_SECRET: ${FORGEJO_OAUTH2_JWT_SECRET:?set by bootstrap}
      FORGEJO__server__LFS_JWT_SECRET: ${FORGEJO_LFS_JWT_SECRET:?set by bootstrap}
      # Whether people may sign themselves up, and how long a refresh token
      # lives, in hours. Bootstrap derives both, from SIGN_UP_OPEN and from
      # UNICON_SESSION_HARD_TTL, which also reach the backend above, so
      # Forgejo and Unicon cannot disagree about either.
      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_DISABLE_REGISTRATION:?set by bootstrap}
      FORGEJO__oauth2__REFRESH_TOKEN_EXPIRATION_TIME: ${FORGEJO_REFRESH_TOKEN_HOURS:?set by bootstrap}
      # Empty until bootstrap has made the Garage key, which it does before it
      # starts this service. Compose interpolates the whole file on every
      # command, so these two cannot demand a value the way the rest do.
      FORGEJO__lfs__MINIO_ACCESS_KEY_ID: ${FORGEJO_S3_ACCESS_KEY}
      FORGEJO__lfs__MINIO_SECRET_ACCESS_KEY: ${FORGEJO_S3_SECRET_KEY}
      # The mail server the confirmation and password-reset mail goes through,
      # from .env. MAIL_ENABLED and MAIL_PROTOCOL are bootstrap's: the mailer
      # is on exactly when MAIL_SMTP_ADDR is set, and it always encrypts, TLS
      # from the start on 465 and STARTTLS required on any other port, so the
      # mail server's password never crosses the network in the clear.
      FORGEJO__mailer__ENABLED: ${MAIL_ENABLED:-false}
      FORGEJO__mailer__PROTOCOL: ${MAIL_PROTOCOL:-smtp+starttls}
      FORGEJO__mailer__SMTP_ADDR: ${MAIL_SMTP_ADDR:-}
      FORGEJO__mailer__SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      FORGEJO__mailer__USER: ${MAIL_SMTP_USER:-}
      FORGEJO__mailer__PASSWD: ${MAIL_SMTP_PASSWORD:-}
      FORGEJO__mailer__FROM: ${MAIL_FROM:-}
    volumes:
      - forgejo-data:/data
      - ./forgejo/app.ini:/etc/unicon/forgejo/app.ini:ro
      # Forgejo's custom path is /data/gitea. The images, the stylesheet and the
      # one header template that give its account pages the Unicon look are
      # read from this repo, so an upgrade of the image keeps them.
      - ./forgejo/custom/public:/data/gitea/public:ro
      - ./forgejo/custom/templates:/data/gitea/templates:ro
    # No published port. People reach Forgejo's sign-in and account pages
    # through the proxy on FORGEJO_PUBLIC_URL, and nothing else of it is
    # reachable from outside the compose network: not the web UI, not the
    # API, not git. Bootstrap drives its API from inside the container.
    # compose.dev.yaml publishes it on loopback for scripts/check-lfs.py.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.18.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_healthy
    environment:
      WOODPECKER_HOST: ${WOODPECKER_PUBLIC_URL:?set by bootstrap}
      WOODPECKER_FORGEJO: "true"
      # API calls go over the compose network; the browser is sent to the public
      # URL instead. Without the second variable Woodpecker would redirect
      # people to http://forgejo:3000, which no browser can resolve. Note that
      # the OAuth host is used for the token request as well, so it has to be
      # reachable from this container too; see compose.dev.yaml.
      WOODPECKER_FORGEJO_URL: http://forgejo:3000
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: ${FORGEJO_PUBLIC_URL:?set by bootstrap}
      # Empty until bootstrap has created the Forgejo OAuth application, which
      # it does before it starts this service, for the same reason as the two
      # Forgejo keys above.
      WOODPECKER_FORGEJO_CLIENT: ${WOODPECKER_FORGEJO_CLIENT}
      WOODPECKER_FORGEJO_SECRET: ${WOODPECKER_FORGEJO_SECRET}
      # No WOODPECKER_AGENT_SECRET. Without a shared secret a machine becomes
      # an agent only by presenting a token the server issued for it, so an
      # agent exists only by enrolment. No agent runs in this file: a grading
      # machine is a separate host, and compose.dev.yaml may run one on the
      # laptop under its own token.
      # Signs the tokens the server hands its agents. Left unset the server
      # generates one at every start, logs a warning, and every agent has to
      # re-register; a restart in the middle of a contest would then interrupt
      # the grading in flight.
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET:?set by bootstrap}
      # Only accounts named here may sign in; WOODPECKER_OPEN stays off.
      WOODPECKER_ADMIN: unicon-ci
      WOODPECKER_OPEN: "false"
      WOODPECKER_AUTHENTICATE_PUBLIC_REPOS: "true"
      # Never sqlite3, which is the default. Under concurrent dispatch it
      # returned HTTP 500 with an empty body and lost between 8 and 51 per cent
      # of pipelines; Postgres lost none at every concurrency measured
      # (stack-test-findings.md section 3.1). Serial development traffic never
      # shows this, which is why it has to be right from the first deployment.
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE: postgres://woodpecker:${WOODPECKER_DB_PASSWORD:?set by bootstrap}@postgres:5432/woodpecker?sslmode=disable
      # Every run asks the backend what it is, and nothing else does: the
      # configuration extension is exclusive, so Woodpecker never reads a
      # pipeline file from a repository, and a repository with one in it runs
      # nothing of it. The backend answers only for a grading it dispatched,
      # checking the server's signature on the request. `private` lets the
      # server call an address inside this network; the default refuses it
      # and Woodpecker then answers the dispatch with an empty 204.
      WOODPECKER_CONFIG_EXTENSION_ENDPOINT: http://backend:8000/api/v1/ci/config
      WOODPECKER_CONFIG_EXTENSION_EXCLUSIVE: "true"
      WOODPECKER_EXTENSIONS_ALLOWED_HOSTS: private
      # The one image a clone step may hand the repository credential to:
      # the platform's clone image, by the digest bootstrap took from the
      # image manifest. A step on this list gets the credential without the
      # repository being trusted with it, which is how a task repository
      # clones with `security` trust off. An entry with a digest matches that
      # digest alone. Setting the list replaces Woodpecker's own, so its git
      # plugin, which no grading run uses, is lent nothing: every run's two
      # checkouts are the clone image, named in the extension's answer.
      WOODPECKER_PLUGINS_TRUSTED_CLONE: ${UNICON_CLONE_IMAGE}
      # Minutes. The forge's clock is built on the default: a run gets 30
      # minutes (RUN_TIMEOUT in the forge package), of which it allows the
      # checkouts 4 and the reports 1, and caps a harness's wall time at the
      # 25 left. A grading run still going after that is stuck. Change the two
      # together.
      WOODPECKER_MAX_PIPELINE_TIMEOUT: "60"
      WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: "30"
      WOODPECKER_LOG_LEVEL: info
    # No healthcheck here: the image declares its own and has no shell to write
    # a better one with.
    # No published port here. Woodpecker is an operator's interface, not part of
    # the app, and a deployment that wants it reachable puts it behind its own
    # ingress under a name it controls. compose.dev.yaml publishes it on
    # loopback, which is also what lets bootstrap finish the token dance against
    # WOODPECKER_PUBLIC_URL from the machine it runs on.
    volumes:
      - woodpecker-data:/var/lib/woodpecker

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    # Secrets are passed here rather than written into garage/garage.toml, which
    # is committed. Garage also refuses to read a secrets file that other users
    # can read, which a bind mount from Windows always is.
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set by bootstrap}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set by bootstrap}
      # The image's own level, Info for every part of Garage, except the
      # request log of its HTTP APIs, which writes each request with its
      # whole query. A presigned URL's signature is in that query, and it
      # lets anyone reading the log write that object until it expires. At
      # Warn the request log writes only the requests that end in a server
      # error, query included.
      RUST_LOG: garage=info,garage_api_common::generic_server=warn
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    # No published ports. Only the compose network needs S3, and the admin API
    # is a full-control interface. Bootstrap does not need either: it drives
    # Garage through the container's own command line. compose.dev.yaml
    # publishes both on loopback for scripts/check-lfs.py.
    healthcheck:
      # Exits non-zero until the cluster layout has been applied, which is what
      # bootstrap does. A fresh stack is unhealthy here until it is bootstrapped.
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    # Deliberately no depends_on: the proxy comes up whether or not the app
    # services are running. See the comment in proxy/nginx.conf.
    # The site file is a template: the image fills in ${FORGE_HOST}, the
    # hostname Forgejo is served under, ${APP_URL}, where the forge's sign-out
    # sends the browser back to, and the two caps on live streams, and the
    # filter keeps it from touching any other dollar sign in the file, which
    # are all nginx's own. main.conf sizes the connections those caps fit in.
    volumes:
      - ./proxy/main.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      FORGE_HOST: ${FORGEJO_DOMAIN:?set by bootstrap}
      APP_URL: ${UNICON_PUBLIC_URL:?set by bootstrap}
      LIVE_STREAMS: ${UNICON_LIVE_STREAMS:-3000}
      LIVE_STREAMS_PER_ADDRESS: ${UNICON_LIVE_STREAMS_PER_ADDRESS:-1000}
      NGINX_ENVSUBST_FILTER: ^(FORGE_HOST|APP_URL|LIVE_STREAMS|LIVE_STREAMS_PER_ADDRESS)$$
    # Above the 16384 descriptors main.conf lets each worker open, whatever
    # the Docker host's default.
    ulimits:
      nofile: 65536
    ports:
      - "8080:80"
    healthcheck:
      # Answered by nginx itself, so it says whether the proxy is up without
      # depending on the app services it may or may not be able to reach.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/-/proxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Runs the migrations and exits. The backend image does not migrate on its own,
  # so this has to finish before the API starts; two copies of the API racing
  # each other through Alembic on a rollout is the failure this avoids. The
  # migrations belong to the forge package, which the backend image installs
  # with its `unicon-forge` command on PATH, so this runs that command rather
  # than the backend's own.
  backend-migrate:
    image: ghcr.io/uniconhq/backend:main
    profiles: [app]
    restart: "no"
    entrypoint: ["unicon-forge"]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    # Not the whole backend environment. `unicon-forge migrate` reads one setting,
    # the database URL, and giving a migration job the OAuth client secret and
    # the token encryption key spreads them over a second container for nothing.
    environment:
      UNICON_DATABASE_URL: *database-url

  backend:
    image: ghcr.io/uniconhq/backend:main
    profiles: [app]
    restart: unless-stopped
    # Not Forgejo. The backend answers /healthz and /readyz with Forgejo down
    # and degrades /me instead, which is the behaviour a contest needs; waiting
    # for Forgejo here would mean a slow Forgejo start keeps the whole app off
    # the air.
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    environment: *backend-env
    # No healthcheck here: the backend image declares its own, against
    # 127.0.0.1:8000/healthz using the interpreter it already ships. Writing one
    # here would mean guessing which tools that image has.

  frontend:
    image: ghcr.io/uniconhq/frontend:main
    profiles: [app]
    restart: unless-stopped
    healthcheck:
      # 8080, not 80: the image runs nginx as an ordinary user, which cannot
      # bind a privileged port. 127.0.0.1, not localhost: that nginx listens on
      # IPv4 only, and busybox wget tries ::1 first and does not fall back.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
  forgejo-data:
  woodpecker-data:
  garage-meta:
  garage-data:
