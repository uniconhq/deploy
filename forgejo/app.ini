; Forgejo configuration for Unicon.
;
; This file is the record. compose.yaml copies it over /data/gitea/conf/app.ini
; on every container start, so a hand edit inside a running instance is gone
; after the next deploy. Change Forgejo here, never in the web UI.
;
; Secrets are not here. They arrive as FORGEJO__section__KEY environment
; variables from deploy/.env and the image merges them into the copy before
; Forgejo reads it: the database password, SECRET_KEY, INTERNAL_TOKEN, the
; OAuth2 and LFS JWT secrets, the Garage access key, and ROOT_URL. So do the
; two settings bootstrap derives from other keys in .env: whether sign-up is
; open, and how long a refresh token lives.

APP_NAME = Unicon
RUN_MODE = prod

[server]
APP_DATA_PATH = /data/gitea
PROTOCOL = http
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DOMAIN = localhost
; ROOT_URL comes from the environment. It is the URL a browser uses: Forgejo's
; own hostname on the Unicon proxy, which routes the sign-in and account pages
; and nothing else. Other containers reach Forgejo at http://forgejo:3000.
DISABLE_SSH = true
; No calls out to gravatar or any CDN.
OFFLINE_MODE = true
LFS_START_SERVER = true
; 2 GiB. The default, 0, means no limit at all; a contest platform that accepts
; arbitrary files should state a ceiling. Verified at 500 MB through the
; contents API by scripts/check-lfs.py.
LFS_MAX_FILE_SIZE = 2147483648

[database]
DB_TYPE = postgres
HOST = postgres:5432
NAME = forgejo
USER = forgejo
SSL_MODE = disable
LOG_SQL = false

[lfs]
; Large files sit in Garage next to everything else Unicon stores. PATH is only
; read when STORAGE_TYPE is local; it stays so the fallback is a real path.
PATH = /data/git/lfs
STORAGE_TYPE = minio
MINIO_ENDPOINT = garage:3900
MINIO_BUCKET = forgejo-lfs
MINIO_LOCATION = garage
MINIO_BASE_PATH = lfs/
MINIO_USE_SSL = false
; Garage has no virtual-host style DNS in this deployment, so addressing is by
; path. The key in Forgejo 15 is MINIO_BUCKET_LOOKUP, not the
; MINIO_BUCKET_LOOKUP_TYPE the current config cheat sheet prints; a wrong key
; is ignored silently and LFS quietly keeps working against local disk.
MINIO_BUCKET_LOOKUP = path

[session]
; The default is memory, which signs everyone out of Forgejo on every restart.
; Unicon sessions are separate and survive either way.
PROVIDER = db

[security]
INSTALL_LOCK = true
; How many reverse proxies stand in front of Forgejo, counted from Forgejo
; outwards. One: the Unicon proxy, which sets X-Forwarded-For and
; X-Forwarded-Proto. Every address on the compose network is trusted to be
; that proxy, because Forgejo has no published port and nothing else reaches
; it: the backend and the CI, which come without the header, are seen as
; themselves.
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = *

[service]
; DISABLE_REGISTRATION comes from the environment: bootstrap derives it from
; SIGN_UP_OPEN in deploy/.env, the one switch that also decides whether the
; landing page offers Create account. Closed, the operator makes accounts with
; `unicon create-account`.
; Anyone who signs themselves up confirms their address by mail before the
; account works. A contest's email_pattern trusts only confirmed addresses, so
; without this anyone could type one that matches. Forgejo quietly drops the
; confirmation when it has no mailer, which is why bootstrap refuses open
; sign-up without MAIL_SMTP_ADDR in .env. An account the operator makes is
; confirmed as made.
REGISTER_EMAIL_CONFIRM = true
; Nothing is readable without signing in. Every read the platform makes goes
; through an account, and a visitor sees the sign-in page.
REQUIRE_SIGNIN_VIEW = true
; Only the Unicon backend creates organisations, with its own token.
DEFAULT_ALLOW_CREATE_ORGANIZATION = false

[admin]
DISABLE_REGULAR_ORG_CREATION = true
; What a person may not do from Forgejo's own settings pages. Deleting an
; account is Unicon's flow, which ends roles and registrations first, and git
; is closed to people (proxy/nginx.conf), so keys would open nothing. Forgejo
; then refuses these itself, not only the proxy, and leaves them out of its
; pages: the Delete account section, and the SSH / GPG keys page.
USER_DISABLED_FEATURES = deletion, manage_ssh_keys, manage_gpg_keys

[packages]
; Nothing uses Forgejo's package registry, and its pages are not routed.
ENABLED = false

[repository]
ROOT = /data/git/repositories
; Nobody gets personal repositories. Every repository is created by the
; backend in an organisation.
MAX_CREATION_LIMIT = 0

[repository.local]
LOCAL_COPY_PATH = /data/gitea/tmp/local-repo

[repository.upload]
TEMP_PATH = /data/gitea/uploads

[actions]
; Woodpecker is the CI. Forgejo Actions is off instance-wide.
ENABLED = false

[webhook]
; Webhooks may only point at Unicon. The default, external, would let a repo
; owner aim one anywhere on the public internet.
ALLOWED_HOST_LIST = backend
DELIVER_TIMEOUT = 5

[quota]
; Per owner, not per repository. Groups and rules are created with each
; organisation at provisioning time.
ENABLED = true

[oauth2]
; Unicon holds the person's Forgejo token and refreshes it, so these two
; numbers decide how long a Unicon session can keep acting in Forgejo. The
; access token lives an hour, in seconds; the default is the same, so this
; only pins it against a future change of default.
ACCESS_TOKEN_EXPIRATION_TIME = 3600
; REFRESH_TOKEN_EXPIRATION_TIME comes from the environment: bootstrap derives
; it, in hours, from UNICON_SESSION_HARD_TTL in deploy/.env, so a Unicon
; session never outlives the refresh token behind it.
; A refresh returns a new refresh token and keeps the old one usable until it
; expires. Two browser tabs refreshing at once must not sign the person out.
INVALIDATE_REFRESH_TOKENS = false

[indexer]
ISSUE_INDEXER_PATH = /data/gitea/indexers/issues.bleve
REPO_INDEXER_ENABLED = false

[picture]
AVATAR_UPLOAD_PATH = /data/gitea/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /data/gitea/repo-avatars

[attachment]
PATH = /data/gitea/attachments

[log]
MODE = console
LEVEL = warn
ROOT_PATH = /data/gitea/log
; The router logger writes a line for every request at Info, with its path
; and query whole, and the sign-in's OAuth state is in that query. It has a
; console writer of its own at Warn, so whatever LEVEL above is set to, and
; compose.dev.yaml sets it to Info, only a request still running after three
; seconds, a panic and a request no handler took are written. Forgejo 15
; reads this key; the logger.router.MODE of older cheat sheets still works
; but is reported as deprecated.
LOGGER_ROUTER_MODE = router

[log.router]
MODE = console
LEVEL = warn

[mailer]
; The mail server comes from .env, through the FORGEJO__mailer__* variables in
; compose.yaml; with MAIL_SMTP_ADDR empty, bootstrap leaves the mailer off.
ENABLED = false

[cron.gc_lfs]
; Removes large-file objects no commit points at. Uploads reach the store
; before the commit that names them (PROPOSAL section 14), so an upload nobody
; submits leaves an object linked to a repository and referenced by nothing;
; the platform cannot delete it, because Forgejo owns this bucket and exposes
; no API for its objects. This is the only thing that collects them.
;
; An upload row lapses after two days, so OLDER_THAN is set well past that: a
; file is collected about a week after it was uploaded, never while the person
; could still submit it. Every object of every repository is checked on each
; run rather than a sample, because submission and task repositories hold a
; handful each and a deterministic sweep is easier to reason about than a
; probabilistic one.
ENABLED = true
RUN_AT_START = false
SCHEDULE = @midnight
OLDER_THAN = 168h
LAST_UPDATED_MORE_THAN_AGO = 72h
NUMBER_TO_CHECK_PER_REPO = 1000
PROPORTION_TO_CHECK_PER_REPO = 1.0
