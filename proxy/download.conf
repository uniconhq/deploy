# What the download door's two locations in the site template share, a
# submission's file and a task's own file alike; see the comments there. Each
# location keeps only what differs: its pattern, the map variable the door's
# answer is held in, the Host line, which names the forge's hostname that the
# template fills in, and the proxy_pass to its own map. compose mounts it
# beside the templates as it is, since it holds nothing to fill in.

# A GET alone: Forgejo's media endpoint answers no HEAD.
if ($request_method != GET) {
    return 404;
}

auth_request /-/downloads/door;
auth_request_set $download_authorization $upstream_http_x_forge_authorization;
auth_request_set $download_disposition $upstream_http_x_download_disposition;

proxy_set_header Authorization $download_authorization;
proxy_set_header Cookie "";
proxy_set_header X-Forge-Path "";
proxy_set_header X-Forge-Authorization "";
include /etc/nginx/forwarded.conf;

proxy_buffering off;
proxy_read_timeout 300s;

proxy_hide_header Set-Cookie;
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Type;
proxy_hide_header Content-Disposition;
proxy_hide_header Cache-Control;
proxy_intercept_errors on;
error_page 300 301 302 303 304 305 306 307 308
           400 401 402 403 404 405 406 407 408 409 410 411 412 413 414
           415 417 418 421 422 423 424 425 426 428 429 431 451
           500 501 502 503 504 505 506 507 508 510 511 = @download_refused;

# A content security policy of its own in place of the site's, so these
# headers replace the site's rather than merge with them, and the rest of the
# site's are said again.
add_header_inherit on;
add_header Content-Type application/octet-stream always;
add_header Content-Disposition $download_disposition always;
add_header Cache-Control "private, no-store" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
add_header Referrer-Policy same-origin always;
add_header Strict-Transport-Security $hsts always;

set $forgejo http://forgejo:3000;
