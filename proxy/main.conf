# The proxy's main configuration, in place of the image's own, which is the
# same but for the connections below. The two servers are in nginx.conf, which
# the image fills in and includes from conf.d.
#
# Connections. Every live stream holds two connections for as long as its tab
# is in front, one from the browser and one to the backend, and nginx counts
# both against `worker_connections`. The image's 1024 per worker is about a
# thousand tabs on a two-CPU host, and past it sign-in and every page stop
# answering for everyone. 8192 per worker lets a single worker hold every live
# stream nginx.conf allows (3000 by default, 6000 connections) with room left
# for pages, so the limit holds on a one-CPU host and however unevenly the
# workers share the connections. A worker holds one file descriptor per
# connection besides its logs and buffered request bodies, so it may open
# twice as many; compose sets the container's own limit to 65536, above
# that whatever the Docker host's default is.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
