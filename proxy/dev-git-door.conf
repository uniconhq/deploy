# Development only: how the laptop's grading machine reads task and
# submission repositories. compose.dev.yaml mounts this beside nginx.conf; the
# production shape never has it.
#
# A run's checkout clones the repository at the URL Forgejo reports for it,
# http://${FORGE_HOST}:8080/..., and the CI lends its credential for that host
# name alone. Inside a step container that name cannot reach anything: curl,
# which git and git-lfs speak HTTP through, answers every name under
# .localhost with loopback without asking DNS, and the step's loopback is the
# step itself. So the CI hands every step this listener as its HTTP proxy
# (WOODPECKER_BACKEND_HTTP_PROXY in compose.dev.yaml, with the proxy's own
# name left out of it). Through a proxy curl never resolves the forge's name,
# it sends the whole URL here, and the credential still goes with it, since
# the name in the URL is the one the credential is for.
#
# Only what a checkout does passes: the ref advertisement and the fetch of the
# smart HTTP protocol, and LFS's batch request and object downloads, for the
# forge's host and no other. Pushes, LFS uploads, the web UI, the API and any
# other host a step names answer 404. The map below decides on the method and
# the request's path exactly as the step sent it, before nginx decodes or
# merges anything, and that same path is what Forgejo gets: a path that only
# becomes a checkout path once `..`, `%2F` or a doubled slash is resolved never
# matches, and nothing with a query but the ref advertisement's own passes.
# Forgejo checks the credential and the account's read access as for any
# clone. The listener is not published: only containers on the compose
# network reach it.
#
# A grading machine outside a deployment reads the same repositories through
# the machine door on the public host, which is feature 12; this listener is
# its stand-in on a laptop, with the CI's own credential and no door check.

map "$request_method $request_uri" $dev_git_read {
    default 0;
    "~^GET /[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*\.git/info/refs\?service=git-upload-pack$" 1;
    "~^POST /[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*\.git/git-upload-pack$" 1;
    "~^POST /[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*\.git/info/lfs/objects/batch$" 1;
    "~^GET /[A-Za-z0-9_-][A-Za-z0-9._-]*/[A-Za-z0-9_-][A-Za-z0-9._-]*\.git/info/lfs/objects/[0-9a-f]{64}(/[A-Za-z0-9_-][A-Za-z0-9._-]*)?$" 1;
}

# A git client reads none of the site's security headers (nginx.conf), so
# neither server here sends them.
server {
    listen 3128 default_server;
    server_name _;
    access_log /var/log/nginx/access.log unicon;
    add_header_inherit off;
    location / {
        return 404;
    }
}

server {
    listen 3128;
    server_name ${FORGE_HOST};

    access_log /var/log/nginx/access.log unicon;
    server_tokens off;
    add_header_inherit off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $http_host;
    include /etc/nginx/forwarded.conf;

    location / {
        if ($dev_git_read = 0) {
            return 404;
        }
        set $forge http://forgejo:3000;
        proxy_pass $forge;
    }
}
