# Who a request passed on is from, included by every location of the site
# templates that passes one on, each beside a Host line of its own:
# proxy_set_header does not inherit once a level sets a header of its own, so
# each such level includes this again. compose mounts it beside the templates
# as it is, since it holds nothing to fill in.
proxy_set_header X-Real-IP $remote_addr;
# The connection's address alone, never added to what the client sent: the
# backend and Forgejo read the client from this header, and an address a
# client wrote itself would be stored as theirs. This holds while the proxy is
# the edge; behind a load balancer it would come from the balancer's header,
# through set_real_ip_from.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
