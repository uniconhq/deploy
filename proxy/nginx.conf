# The one way in. Two hostnames on one listener, and nothing that is not
# listed here is reachable from outside the compose network.
#
# The default server is the app: the frontend on its few routes, the backend at
# /api/, its OpenAPI document and the two health endpoints, and the two object
# storage buckets a browser and a grading machine write to through presigned
# URLs. Same origin is what lets the Unicon session cookie be SameSite=Lax with
# no CSRF tokens, and what lets a browser upload with no CORS.
#
# The second server is Forgejo on its own hostname, ${FORGE_HOST}, for people
# only: sign-in, sign-up, the OAuth pages and the account settings that hold
# the password, the email and two-factor. Its web UI, its API, token minting
# and git over HTTP are not routed, so every write to the forge goes through
# Unicon, and a leaked personal token is useless from outside. The machine
# door, git reads and LFS downloads for grading machines outside the
# deployment, is feature 12 and is not here yet.
#
# This file is a template: the nginx image substitutes ${FORGE_HOST} and
# ${APP_URL}, where the forge's sign-out sends the browser back to, when the
# container starts, and nothing else, because compose sets
# NGINX_ENVSUBST_FILTER to exactly those two names. Every other dollar sign
# here is nginx's own.
#
# A path neither server lists answers 404. A new frontend route is added here
# as well as in the frontend, on purpose: the proxy is the list of what is
# exposed.

# The login callback carries `code` and `state` in its query string. Both are
# credentials for the few seconds they live, and an access log is copied,
# shipped and kept far longer than that, so this request is logged without its
# query, as are the ones below. Everything else is logged whole.
map $uri $logged_request {
    default               $request;
    /api/v1/auth/callback "$request_method $uri";
    # A grading's envelope URL carries the key that hands out the run's
    # callback token, and a presigned object URL carries the signature that
    # lets its holder write the object, both until they expire.
    ~^/api/v1/gradings/[^/]+/envelope$ "$request_method $uri";
    ~^/unicon-results(/|$)   "$request_method $uri";
    # On the forge's host: the start of the same sign-in, whose query holds
    # the `state` the callback above carries back, with its nonce and PKCE
    # challenge, for the app and for the CI alike; and the links in Forgejo's
    # mail, which confirm an address or reset a password with the code in
    # their query, for hours.
    ~^/login/oauth/authorize  "$request_method $uri";
    ~^/user/activate          "$request_method $uri";
    ~^/user/recover_account   "$request_method $uri";
}

# HSTS only where the connection is already TLS: sent over plain http it would
# be ignored at best and would lock a development browser out at worst. nginx
# leaves out a header whose value is empty.
map $scheme $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# A cookie cleared on a site served over TLS is cleared with Secure, the way
# Forgejo set it there.
map $scheme $cookie_secure {
    https   "; Secure";
    default "";
}

# Guessing passwords at the forge's sign-in form, and the same at sign-up,
# password reset and two-factor, is slowed per client address. Only a form
# post counts: an empty key is not limited, so loading a page, its styles and
# its images never is. Each address gets 30 posts a minute, and that rate is
# what bounds guessing: however an address spaces its posts, it gets no more
# than 30 a minute for long. On top of the rate an address may send 240 posts
# at once, and none of them is held, because a form post that waits more than
# a few seconds looks like a hung page. 240 is a lab of 80 behind one
# address, or a campus network at a contest's start, all signing in for the
# first time with accounts the operator made: the sign-in, the new password
# and the consent, three posts each. Past those a post meets the 429 page
# below, and a minute later another 30 pass. A typing mistake never comes
# near it. The address is the connection's, which is the client's while this
# proxy is the edge; behind a load balancer it would be the balancer's, and
# the key would have to come from its header instead.
map $request_method $sign_in_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sign_in_post zone=sign_in:10m rate=30r/m;

log_format unicon '$remote_addr - $remote_user [$time_local] "$logged_request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Where an upload's bytes may go, worked out from what the door answered.
#
# nginx copies a proxy_pass variable into the upstream request line byte for
# byte, and an empty one makes it send the browser's own URI and query string
# instead, so the one thing that must never happen is using that answer
# unchecked. This holds it to the single shape it may have: a place, the
# large-file objects path, a SHA-256 and a length. Anything else, an empty
# answer included, becomes a path Forgejo has nothing at, which comes back as
# the same bare 403 as every other refusal.
#
# It is a map and not an `if` because `if` belongs to the rewrite phase and
# auth_request to the access phase after it, so an `if` here would read the
# answer before there was one. A map is worked out where it is used, which is
# the proxy_pass itself.
map $door_path $upload_target {
    default "/-/no-such-upload";
    "~^/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.git/info/lfs/objects/[0-9a-f]{64}/[0-9]+$" $door_path;
}

# The download door's answer, held the same way: a submission repository's
# media endpoint for one file under files/, at a submission's tag, with the
# path and the tag encoded as the backend wrote them.
map $download_path $download_target {
    default "/-/no-such-download";
    "~^/api/v1/repos/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/media/files/[A-Za-z0-9._~%-]+/[A-Za-z0-9._~%-]+\?ref=submission%2F[0-9]+$" $download_path;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log unicon;

    # No nginx version in responses or error pages.
    server_tokens off;
    # A redirect nginx writes itself carries only the path, so the browser
    # keeps the host and port it came in on. Written whole, it would name the
    # port nginx listens on inside its container, not the one people reach.
    absolute_redirect off;

    # Every response, whichever service answered it, and on error pages too.
    # The app holds a session cookie and state-changing forms, so it is never
    # framed; the type of a response is what the server said and nothing the
    # browser guessed; and no URL of this site travels to another one. A full
    # content security policy waits until the frontend's inline styles and the
    # avatar host are settled, so only frame-ancestors is set here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security $hsts always;

    # Submissions come through here as uploads to object storage; the backend
    # checks the size before it issues the upload URL.
    client_max_body_size 1g;
    # Stream the body to the backend instead of spooling it to disk first. An
    # oversized upload is then cut off early rather than after every byte has
    # landed; the client sees a stalled connection instead of a clean error,
    # which is why the frontend pre-checks size.
    proxy_request_buffering off;

    # Docker embedded DNS. Naming a resolver and putting each upstream in a
    # variable makes nginx resolve at request time rather than at start-up, so
    # the proxy comes up even when backend and frontend are not running. With a
    # literal host name nginx refuses to start with "host not found in
    # upstream", and a developer who only wants Forgejo and Garage gets nothing.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    # $http_host, not $host: $host drops the port, so a redirect the backend
    # builds from the Host header would send a browser on localhost:8080 to
    # localhost:80. In development the port is the whole address.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Whether nginx itself is up, answered without reaching anything else. The
    # compose healthcheck asks for this, so a proxy that cannot route still
    # reports the difference between "not started" and "nothing behind it".
    location = /-/proxy {
        access_log off;
        return 204;
    }

    # The forge pushes its events to the backend inside the stack, at
    # http://backend:8000, so nothing outside has a reason to reach this path.
    location ^~ /api/v1/events/ {
        return 404;
    }

    # The CI's configuration extension. Woodpecker calls it inside the stack,
    # at http://backend:8000, for every run it starts, so nothing outside has
    # a reason to reach it either. The routes a grading machine does use, a
    # grading's envelope and its callback, are under /api/v1/gradings/ and go
    # to the backend with the rest of /api/.
    location ^~ /api/v1/ci/ {
        return 404;
    }

    # proxy_pass with a variable and no path passes the original request URI
    # unchanged, so /api/v1/me reaches the backend as /api/v1/me.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # The backend's API document stays on its own port: it lists every route,
    # the machines' and the forge's included, and the frontend builds against
    # the copy committed in the backend's repository.
    location = /openapi.json {
        return 404;
    }

    location = /healthz {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location = /readyz {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # Object storage, for the one write that goes straight to it from
    # outside: a grading machine's run log into unicon-results, a presigned
    # PUT. The backend signs the URL for UNICON_MACHINE_URL and Garage checks
    # the signature against the Host header, so the header goes through as the
    # client sent it, and Garage, which has no root_domain, reads the bucket
    # from the path. Nothing else reaches Garage: no read, no listing, no
    # other bucket, and a path whose first segment as sent is not the bucket's
    # name is refused before nginx resolves it.
    #
    # A person's files do not come this way. They go through the upload door
    # below, into the bucket Forgejo owns, which nothing outside the stack
    # addresses directly.
    location ^~ /unicon-results/ {
        if ($request_method != PUT) {
            return 404;
        }
        if ($request_uri !~ ^/unicon-results/) {
            return 404;
        }
        set $garage http://garage:3900;
        proxy_pass $garage;
    }

    # The upload door. Every file a person uploads, a two-kilobyte solution
    # and a two-gigabyte model alike, goes through here into the forge's own
    # large-file store, and never through the platform.
    #
    # Before nginx reads a byte of the body it asks the backend whether this
    # upload may start (auth_request, below). The backend answers 204 and two
    # headers for the owner's own waiting upload of exactly this length, and
    # 403 for anything else. The headers say where at the forge the bytes go
    # and what credential to present, and nginx puts the body through to that
    # path with that credential.
    #
    # What this block is careful about, in order:
    #
    #   * Only the backend's answer decides the destination. Nothing the
    #     browser sent builds the path: the id in the URL is a handle the
    #     backend looks up, and the repository, digest and length all come
    #     back from it.
    #   * The browser's own Authorization is replaced, never forwarded, so a
    #     stolen token is as useless here as everywhere else, and its Cookie
    #     is dropped, so the app's session never reaches Forgejo.
    #   * The forge's answer is not passed back. Its refusals name the object
    #     store's address in them, which is nothing a contestant should see;
    #     the browser gets the status and an empty body, and reads where the
    #     upload stands from the platform instead.
    #   * The body is streamed, not spooled. proxy_request_buffering is off
    #     for this server, so nginx does not write two gigabytes to its own
    #     disk before forwarding a byte.
    #
    # Forgejo checks the person's write access to that repository and hashes
    # the body as it stores it, refusing anything that is not the digest and
    # length the path names. So a flaw in the check above cannot put bytes
    # into a repository the person may not write to, nor store them under a
    # name that is not their hash.
    location ~ "^/-/uploads/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" {
        if ($request_method != PUT) {
            return 404;
        }
        # Forgejo's own [server] LFS_MAX_FILE_SIZE. nginx answers 413 from
        # the Content-Length alone, before the door is asked and before a
        # byte of the body is read, so a file past the ceiling costs nothing
        # to refuse. No slot is ever for more than this, so for everything
        # that had one the door's own check on length is what refuses.
        client_max_body_size 2g;

        auth_request /-/uploads/door;
        auth_request_set $door_path $upstream_http_x_forge_path;
        auth_request_set $door_authorization $upstream_http_x_forge_authorization;

        proxy_set_header Authorization $door_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Forge-Path "";
        proxy_set_header X-Forge-Authorization "";
        proxy_set_header Host ${FORGE_HOST};
        # proxy_set_header does not inherit once a level sets any of its own,
        # so the server's four lines have to be repeated here. Forgejo trusts
        # this proxy for the client's address, and the browser would
        # otherwise be setting it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A slow but moving upload is fine: these are gaps between reads and
        # writes, not a total. The read timeout also covers the pause after
        # the last byte, while Forgejo finishes writing to the store. The body
        # timeout is what stops a drip feed holding a slot open for ever.
        client_body_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Nothing of Forgejo's own answer reaches the browser: not its
        # headers, which are its vhost's and not this one's, and not its
        # bodies, where a refusal of an upload names the object store's
        # address. Only the status comes back, and only for the statuses
        # below; 413 is left out so nginx's own answer about size reaches the
        # browser as itself, which is the one refusal a person can act on.
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Type;
        proxy_intercept_errors on;
        error_page 300 301 302 303 304 305 306 307 308
                   400 401 402 403 404 405 406 407 408 409 410 411 412 414
                   415 416 417 418 421 422 423 424 425 426 428 429 431 451
                   500 501 502 503 504 505 506 507 508 510 511 = @upload_refused;

        set $forgejo http://forgejo:3000;
        proxy_pass $forgejo$upload_target;
    }

    # The forge's refusal, with its own words left out of it. `return 403`
    # answers with nginx's own empty body and its own Content-Length; adding
    # one here would send two, which a client reads as a broken response.
    # A request that is not a PUT and one the door turned down read the same
    # from outside, since this catches nginx's own refusals here too.
    location @upload_refused {
        internal;
        return 403;
    }

    # The question itself. Reachable only from the block above: `internal`
    # keeps it from being requested directly, and /-/uploads/door does not
    # match the door's own location, so nothing outside can ask it. The
    # backend serves it outside /api/ and leaves it out of the OpenAPI
    # document, because its answer carries a credential.
    location = /-/uploads/door {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Upload-Length $content_length;
        # As above: setting any header here drops the server's own four.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $backend http://backend:8000;
        proxy_pass $backend/-/uploads/door;
    }

    # The download door, the upload door the other way round. A person gets
    # one file of one of their own submissions back, a two-kilobyte solution
    # or a two-gigabyte model alike, streamed from the forge's store through
    # here and never through the platform.
    #
    # nginx asks the backend first (auth_request, below), which answers 204
    # and three headers for the signed-in person's own submission and a path
    # its submission names, and 401 or 403 for anything else: where at the
    # forge the file is read whole, the person's own credential to present
    # there, and the name the download takes. The same care as the upload
    # door's applies:
    #
    #   * Only the backend's answer decides what is read. The address names
    #     the submission by its names and number, which the backend looks up
    #     and checks; the repository and the version come back from it, and
    #     the map above holds them to their one shape.
    #   * The browser's Authorization is replaced and its Cookie dropped. Its
    #     Range goes through, so a long download that drops resumes.
    #   * Nothing of the forge's own answer but the bytes, their length and
    #     their range reaches the browser. The type is set here, always as a
    #     download that names its file, so nothing a contestant submitted is
    #     ever shown as a page of this site.
    #   * The answer is streamed, not spooled: proxy_buffering is off, so
    #     nginx does not write two gigabytes to its own disk on the way.
    #
    # The forge checks the person's read access to that repository as it
    # serves, so a flaw in the check above cannot read a repository the
    # person may not read.
    location ~ "^/-/downloads/[^/]+/[^/]+/[^/]+/[0-9]+/files/[^/]+/[^/]+$" {
        # A GET alone: Forgejo's media endpoint answers no HEAD.
        if ($request_method != GET) {
            return 404;
        }

        auth_request /-/downloads/door;
        auth_request_set $download_path $upstream_http_x_forge_path;
        auth_request_set $download_authorization $upstream_http_x_forge_authorization;
        auth_request_set $download_disposition $upstream_http_x_download_disposition;

        proxy_set_header Authorization $download_authorization;
        proxy_set_header Cookie "";
        proxy_set_header Host ${FORGE_HOST};
        proxy_set_header X-Forge-Path "";
        proxy_set_header X-Forge-Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_intercept_errors on;
        error_page 300 301 302 303 304 305 306 307 308
                   400 401 402 403 404 405 406 407 408 409 410 411 412 413 414
                   415 417 418 421 422 423 424 425 426 428 429 431 451
                   500 501 502 503 504 505 506 507 508 510 511 = @download_refused;

        # add_header here replaces the server's own, so they are said again.
        add_header Content-Type application/octet-stream always;
        add_header Content-Disposition $download_disposition always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security $hsts always;

        set $forgejo http://forgejo:3000;
        proxy_pass $forgejo$download_target;
    }

    # Every refusal of a download, nginx's own and the forge's, reads the
    # same: there is no such file for this person.
    location @download_refused {
        internal;
        return 404;
    }

    # The download door's question, reachable only from the block above.
    location = /-/downloads/door {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $backend http://backend:8000;
        proxy_pass $backend/-/downloads/door;
    }

    # The frontend's routes, one line each, and its bundle. The frontend's own
    # nginx answers index.html for any path, so listing them here is the only
    # thing that keeps an unknown path from being served.
    location = / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location = /login {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location = /account {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    # Every organiser page, from creating an org down to a task's files.
    location = /orgs {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location ^~ /orgs/ {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    # A contest's page and its tasks' pages, one address for a visitor and
    # for a signed-in person. There is no page at /contests itself, and it is
    # answered here rather than redirected to one.
    location = /contests {
        return 404;
    }

    location ^~ /contests/ {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location ^~ /assets/ {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location = /favicon.svg {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name ${FORGE_HOST};

    access_log /var/log/nginx/access.log unicon;
    server_tokens off;
    # A redirect nginx writes itself carries only the path, so the browser
    # keeps the host and port it came in on. Written whole, it would name the
    # port nginx listens on inside its container, not the one people reach.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security $hsts always;
    # Forgejo sends its own; ours is the one that counts.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # Sign-in forms and an avatar. Nothing large comes in this way.
    client_max_body_size 8m;

    # Every form post on this host, the sign-in pages' and the account
    # settings', is slowed per address; see the zone at the top.
    limit_req zone=sign_in burst=240 nodelay;
    limit_req_status 429;
    error_page 429 /-/slow-down;

    location = /-/slow-down {
        internal;
        default_type text/plain;
        return 429 "Too many attempts from your network. Wait a minute, then go back and try again.\n";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The forge's front page is its web UI, which nobody gets. A person who
    # lands here is sent to their account, and Forgejo sends them to sign in
    # first if they have not.
    location = / {
        return 302 /user/settings;
    }

    # Signing out of the app ends here too. The app signs people in through
    # Forgejo, so a Forgejo sign-in left in the browser would sign the next
    # person at it straight back in as this one. Forgejo takes a sign-out only
    # as a form post with its own token, which the app cannot send, so the
    # proxy clears the two cookies that keep someone signed in to Forgejo:
    # `session`, and `persistent`, its remember-me, and sends the browser back
    # to the app's front page. The target is fixed, so this can send nobody
    # anywhere else. The add_header lines here replace the server's own, so
    # its security headers are repeated.
    location = /-/sign-out {
        add_header Set-Cookie "session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax$cookie_secure" always;
        add_header Set-Cookie "persistent=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax$cookie_secure" always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security $hsts always;
        return 302 ${APP_URL}/;
    }

    # Signing in, out and up, and the account recovery pages behind sign-in.
    location ^~ /user/login { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /user/logout { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /user/sign_up { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/activate { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/forgot_password { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/recover_account { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/two_factor { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/webauthn { set $forge http://forgejo:3000; proxy_pass $forge; }

    # The OAuth pages Unicon and Woodpecker send people through, and the token
    # endpoint Woodpecker calls back on the same public name.
    location ^~ /login/oauth/ { set $forge http://forgejo:3000; proxy_pass $forge; }

    # Account settings: the profile page, the email and password page, and the
    # security page that holds two-factor and passkeys. The applications page,
    # where a personal token is minted, is not listed and so answers 404, as
    # do SSH keys, organisations, repositories and everything else under
    # settings. Deleting the account is Unicon's flow, not Forgejo's.
    location = /user/settings { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/settings/account { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /user/settings/account/delete { return 404; }
    location ^~ /user/settings/security { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/settings/avatar { set $forge http://forgejo:3000; proxy_pass $forge; }

    # The page a person made by `unicon create-account` meets at their first
    # sign-in, since the operator hands them a password they must change.
    location = /user/settings/change_password { set $forge http://forgejo:3000; proxy_pass $forge; }

    # What those pages load: the stylesheet, scripts, the Unicon images under
    # /assets/img, and avatars.
    location ^~ /assets/ { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /avatars/ { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /avatar/ { set $forge http://forgejo:3000; proxy_pass $forge; }
    location ^~ /user/avatar/ { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /favicon.ico { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /manifest.json { set $forge http://forgejo:3000; proxy_pass $forge; }
    location = /robots.txt { set $forge http://forgejo:3000; proxy_pass $forge; }

    # Everything else: the web UI, the API, git over HTTP, LFS, token minting.
    location / {
        return 404;
    }
}
