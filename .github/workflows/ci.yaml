name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand to try the stack on unmerged work: every sibling repo is
  # checked out at the branch named here, which each of them must have.
  workflow_dispatch:
    inputs:
      siblings:
        description: The branch to check every sibling repo out at
        default: main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: yamllint
        run: uv run yamllint .

      # docker compose reads .env, and every secret in it is required. Fill the
      # template with a placeholder so the files can be validated without one,
      # into a file of its own so a local run cannot overwrite a real .env.
      - name: compose config
        run: |
          sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)=$/\1=placeholder/' .env.example > .env.check
          docker compose --env-file .env.check -f compose.yaml config --quiet
          docker compose --env-file .env.check -f compose.yaml -f compose.dev.yaml config --quiet

  # The whole stack from nothing: bootstrap, the app profile, and the two
  # answers a deployment is judged by. Later end-to-end tests run on top of
  # this job rather than starting a stack of their own.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # compose.dev.yaml builds backend and frontend from the sibling
      # checkouts, with the forge checkout handed to the backend's build as
      # the context `forge`, and scripts/build-images.py builds the grading
      # images from the runner and the three primitives, so the repos sit
      # beside each other the way they do on a laptop.
      - uses: actions/checkout@v7
        with:
          path: deploy
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/forge
          ref: ${{ inputs.siblings || 'main' }}
          path: forge
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/backend
          ref: ${{ inputs.siblings || 'main' }}
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/frontend
          ref: ${{ inputs.siblings || 'main' }}
          path: frontend
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/runner
          ref: ${{ inputs.siblings || 'main' }}
          path: runner
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/primitive-compile
          ref: ${{ inputs.siblings || 'main' }}
          path: primitive-compile
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/primitive-sandbox-run
          ref: ${{ inputs.siblings || 'main' }}
          path: primitive-sandbox-run
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/primitive-diff-check
          ref: ${{ inputs.siblings || 'main' }}
          path: primitive-diff-check

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --frozen
        working-directory: deploy

      # Into a registry on localhost, for real digests; images.local.json
      # then tells bootstrap what to seed the forge with.
      - name: build the grading images
        working-directory: deploy
        run: uv run scripts/build-images.py

      - name: bootstrap a fresh stack
        working-directory: deploy
        run: uv run bootstrap

      - name: start the app profile
        working-directory: deploy
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile app up -d --build

      - name: the backend is ready and the frontend serves its page
        working-directory: deploy
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz > readyz.json 2>/dev/null; then break; fi
            sleep 5
          done
          cat readyz.json
          grep -q '"ready"' readyz.json
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/openapi.json)" = 404

      # What the proxy exposes and nothing more. The forge host answers its
      # sign-in and account pages; its web UI, its API, token minting and git
      # over HTTP are 404. The app host serves its listed routes and refuses
      # the rest. Both carry the security headers on every answer.
      - name: only the listed paths are reachable
        working-directory: deploy
        run: |
          app="http://localhost:8080"
          forge="http://forge.localhost:8080"
          resolve="--resolve forge.localhost:8080:127.0.0.1"
          status() { curl -s -o /dev/null -w '%{http_code}' $resolve "$1"; }
          expect() {
            got="$(status "$2")"
            if [ "$got" != "$1" ]; then echo "$2 answered $got, expected $1"; exit 1; fi
            echo "$1 $2"
          }
          expect 200 "$app/"
          expect 200 "$app/login"
          expect 200 "$app/account"
          expect 200 "$app/orgs"
          expect 200 "$app/orgs/acme/contests/spring/tasks/sum"
          expect 404 "$app/orgsx"
          expect 200 "$app/contests/acme/spring"
          expect 200 "$app/contests/acme/spring/tasks/sum"
          expect 404 "$app/contests"
          expect 404 "$app/contestsx"
          expect 404 "$app/api/v1/events/forge/acme"
          expect 404 "$app/api/v1/ci/config"
          expect 404 "$app/unicon-results/logs/x"
          expect 404 "$app/-/uploads/door"
          expect 404 "$app/-/uploads/not-a-slot"
          expect 404 "$app/-/downloads/door"
          expect 404 "$app/-/downloads/acme/spring/sum/1/files/submission/main.py"
          expect 404 "$app/-/downloads/acme/spring/sum/1/submission.json"
          expect 404 "$app/forgejo-lfs/lfs/x"
          expect 404 "$app/some/unlisted/path"
          expect 404 "$app/.env"
          expect 404 "$app/index.html"
          expect 200 "$forge/user/login"
          expect 200 "$forge/assets/css/unicon.css"
          expect 303 "$forge/user/settings"
          expect 303 "$forge/user/settings/change_password"
          expect 303 "$forge/login/oauth/authorize"
          expect 404 "$forge/user/settings/applications"
          expect 404 "$forge/user/settings/keys"
          expect 404 "$forge/api/v1/version"
          expect 404 "$forge/api/swagger"
          expect 404 "$forge/explore"
          expect 404 "$forge/unicon"
          expect 404 "$forge/unicon/x.git/info/refs?service=git-receive-pack"
          expect 404 "$forge/unicon/x.git/info/refs?service=git-upload-pack"
          curl -fsS $resolve "$forge/user/login" | grep -q unicon.css
          for url in "$app/" "$forge/user/login" "$app/nothing-here"; do
            curl -s -D - -o /dev/null $resolve "$url" > headers.txt
            grep -qi '^x-content-type-options: nosniff' headers.txt
            grep -qi '^x-frame-options: deny' headers.txt
            grep -qi "^content-security-policy: frame-ancestors 'none'" headers.txt
            grep -qi '^referrer-policy: same-origin' headers.txt
          done
          if docker ps --format '{{.Ports}}' | grep -q '0.0.0.0:3300'; then
            echo "Forgejo is published on every interface"; exit 1
          fi

      # SIGN_UP_OPEN is empty, which is open on a development stack: Forgejo
      # shows its sign-up form and the backend offers Create account. The
      # last step closes it and checks both again.
      - name: sign-up is open on both sides
        working-directory: deploy
        run: |
          resolve="--resolve forge.localhost:8080:127.0.0.1"
          curl -fsS http://localhost:8080/api/v1/auth/register-url | grep -q '"url":"http://forge.localhost:8080/user/sign_up"'
          curl -fsS http://localhost:8080/api/v1/auth/forge-url | grep -q '"url":"http://forge.localhost:8080"'
          curl -fsS $resolve http://forge.localhost:8080/user/sign_up | grep -q 'name="user_name"'

      # The extension refuses every method from outside, and object storage
      # takes only the writes it is routed for. A write with no signature
      # reaches Garage and is refused there with 403.
      - name: the machine paths take only what they are for
        working-directory: deploy
        run: |
          app="http://localhost:8080"
          expect() {
            got="$(curl -s -o /dev/null -w '%{http_code}' -X "$2" "$3")"
            if [ "$got" != "$1" ]; then echo "$2 $3 answered $got, expected $1"; exit 1; fi
            echo "$1 $2 $3"
          }
          expect 404 POST "$app/api/v1/ci/config"
          expect 403 PUT "$app/unicon-results/logs/x"
          expect 404 POST "$app/unicon-results/logs/x"
          # The upload door: the one shape it takes needs a session it has
          # not got, so it refuses; everything else is not routed at all. The
          # question the proxy asks the backend is never routed from outside,
          # whatever it is spelled like.
          slot="00000000-0000-4000-8000-000000000001"
          expect 403 PUT "$app/-/uploads/$slot"
          expect 404 PUT "$app/-/uploads/$slot/extra"
          expect 404 PUT "$app/-/uploads/not-a-slot"
          expect 404 GET "$app/-/uploads/door"
          expect 404 POST "$app/-/uploads/door"
          # The download door: without a session its one shape is no such
          # file, and nothing but a read is routed.
          expect 404 GET "$app/-/downloads/acme/spring/sum/1/files/submission/main.py"
          expect 404 PUT "$app/-/downloads/acme/spring/sum/1/files/submission/main.py"
          expect 404 GET "$app/-/downloads/door"

      # The development git listener every grading step has as its HTTP
      # proxy. A checkout's reads of the forge's host reach Forgejo, which
      # asks for the credential; a push, the API, a path that only turns into
      # a checkout path once nginx resolves it, and every other host are 404.
      - name: a step's HTTP proxy passes checkout reads and nothing else
        working-directory: deploy
        run: |
          forge="http://forge.localhost:8080"
          repo="$forge/unicon/classic.workflow.git"
          expect() {
            want="$1"; shift
            got="$(docker compose -f compose.yaml -f compose.dev.yaml exec -T proxy \
              curl -s -o /dev/null -w '%{http_code}' --path-as-is -x http://127.0.0.1:3128 "$@")"
            if [ "$got" != "$want" ]; then echo "$* answered $got, expected $want"; exit 1; fi
            echo "$want $*"
          }
          expect 401 "$repo/info/refs?service=git-upload-pack"
          expect 404 "$repo/info/refs?service=git-receive-pack"
          expect 404 -X POST "$repo/git-receive-pack"
          expect 404 -X PUT "$repo/info/lfs/objects/$(printf '0%.0s' $(seq 64))"
          expect 404 "$forge/api/v1/version"
          expect 404 "$forge/api/v1/users/../../../unicon/classic.workflow.git/info/refs?service=git-upload-pack"
          expect 404 "$forge/unicon/x.git/info/lfs/objects/batch/../../../../api/v1/version"
          expect 404 "http://forgejo:3000/api/v1/version"
          expect 404 -X POST "http://backend:8000/api/v1/ci/config"
          expect 404 "http://woodpecker-server:8000/api/agents"

      # The grading machine of the dev overlay: the agent bootstrap enrolled
      # connects with the token it wrote, as a global agent that takes
      # pool=platform runs.
      - name: the dev agent connects
        working-directory: deploy
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml --profile agent up -d woodpecker-agent
          token="$(grep '^UNICON_WOODPECKER_TOKEN=' .env | cut -d= -f2-)"
          connected='
          import json, sys
          laptop = [a for a in json.load(open("agents.json")) if a["name"] == "laptop"]
          ok = bool(laptop) and laptop[0]["last_contact"] > 0 and laptop[0]["org_id"] == -1
          sys.exit(0 if ok and laptop[0]["custom_labels"].get("pool") == "platform" else 1)
          '
          for _ in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $token" http://localhost:8000/api/agents > agents.json
            if python3 -c "$connected"; then echo "laptop connected"; exit 0; fi
            sleep 2
          done
          echo "the dev agent never connected"; exit 1

      # A browser from a new org to two verdicts: the organiser pages, the
      # contestant's registration and approval, the submit panel, and a real
      # grading run on the dev agent for the sample solution and a wrong one.
      - name: submit and grade from the browser
        working-directory: deploy
        env:
          UNICON_E2E_URL: http://localhost:8080
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest tests/e2e -v

      - name: a 500 MB file reaches object storage through the forge
        working-directory: deploy
        run: uv run scripts/check-lfs.py --exact

      # Nothing is made the second time: no secret, no version, no agent.
      # Its summary lists what was already there, the primitives and the
      # workflow at v1 among them.
      - name: a second bootstrap changes nothing
        working-directory: deploy
        run: |
          cp .env .env.first
          uv run bootstrap | tee second-run.txt
          diff .env.first .env
          grep -q '^created: 0,' second-run.txt
          for name in unicon/compile unicon/sandbox-run unicon/diff-check; do
            grep -q "present  primitive $name version v1" second-run.txt
          done
          grep -q 'present  workflow unicon/classic version v1$' second-run.txt

      # After the browser test, which signs in from this machine too. A burst
      # of 300 sign-in posts from one address: 240 over the rate pass at once,
      # none held, and the rest are refused with 429; a page load is never
      # held.
      - name: sign-in posts are slowed per address
        working-directory: deploy
        run: |
          resolve="--resolve forge.localhost:8080:127.0.0.1"
          seq 300 | xargs -P 100 -I{} curl -s -o /dev/null -w '%{http_code}\n' --max-time 4 \
            $resolve -X POST -d 'user_name=nobody&password=x' \
            http://forge.localhost:8080/user/login > posts.txt || true
          sort posts.txt | uniq -c
          grep -qx 429 posts.txt
          grep -qx 200 posts.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 $resolve http://forge.localhost:8080/user/login)" = 200

      # The one switch closed: Forgejo refuses sign-up and the landing page
      # no longer offers it, from one line of .env and a bootstrap.
      - name: closing sign-up closes both sides
        working-directory: deploy
        run: |
          sed -i 's/^SIGN_UP_OPEN=.*/SIGN_UP_OPEN=false/' .env
          uv run bootstrap
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/auth/register-url | grep -q '"url":null'
          resolve="--resolve forge.localhost:8080:127.0.0.1"
          curl -fsS $resolve http://forge.localhost:8080/user/sign_up > sign-up.html
          grep -q 'Registration is disabled' sign-up.html
          if grep -q 'name="user_name"' sign-up.html; then echo "Forgejo still offers sign-up"; exit 1; fi

      # forge's live tests, which check what only a real Forgejo and
      # Woodpecker can, against this stack: Forgejo, Garage and the CI on the
      # ports compose.dev.yaml publishes on loopback, with the platform's
      # admin token and the CI account's, and the stack's Postgres for the
      # databases the tests make and drop. The one that stands in for the
      # backend through a whole grading run skips here, since the CI and its
      # step containers would reach the test at host.docker.internal, which
      # Docker on Linux does not name; the browser test above grades on this
      # stack instead. -rs lists every skip with its reason.
      - name: forge's live tests pass against this stack
        working-directory: forge
        run: |
          # An empty value would skip the tests that need it rather than fail.
          env_value() {
            value="$(grep "^$1=" ../deploy/.env | cut -d= -f2-)"
            if [ -z "$value" ]; then echo "$1 is empty in .env" >&2; return 1; fi
            echo "$value"
          }
          forge_token="$(env_value UNICON_FORGE_ADMIN_TOKEN)"
          forge_public_url="$(env_value FORGEJO_PUBLIC_URL)"
          ci_public_url="$(env_value WOODPECKER_PUBLIC_URL)"
          ci_token="$(env_value UNICON_WOODPECKER_TOKEN)"
          s3_access_key="$(env_value UNICON_S3_ACCESS_KEY)"
          s3_secret_key="$(env_value UNICON_S3_SECRET_KEY)"
          harness_image="$(env_value UNICON_HARNESS_IMAGE)"
          clone_image="$(env_value UNICON_CLONE_IMAGE)"
          postgres_password="$(env_value POSTGRES_SUPERUSER_PASSWORD)"
          export UNICON_LIVE_FORGE_URL=http://127.0.0.1:3300
          export UNICON_LIVE_FORGE_ADMIN_TOKEN="$forge_token"
          export UNICON_LIVE_FORGE_PUBLIC_URL="$forge_public_url"
          export UNICON_LIVE_CI_URL=http://127.0.0.1:8000
          export UNICON_LIVE_CI_PUBLIC_URL="$ci_public_url"
          export UNICON_LIVE_CI_ADMIN_TOKEN="$ci_token"
          export UNICON_LIVE_S3_ENDPOINT=http://127.0.0.1:3900
          export UNICON_LIVE_S3_ACCESS_KEY="$s3_access_key"
          export UNICON_LIVE_S3_SECRET_KEY="$s3_secret_key"
          export UNICON_LIVE_HARNESS_IMAGE="$harness_image"
          export UNICON_LIVE_CLONE_IMAGE="$clone_image"
          export UNICON_TEST_DATABASE_URL="postgresql+psycopg://postgres:$postgres_password@127.0.0.1:55432/postgres"
          uv sync --frozen
          uv run --frozen pytest -m live -rs tests/live

      - name: logs
        if: failure()
        working-directory: deploy
        run: docker compose -f compose.yaml -f compose.dev.yaml --profile app --profile agent logs --no-color | tail -300
