# unicon/classic-folder@v1, the built-in workflow for a program of several
# files: compile the contestant's folder of sources once, starting from the
# entry point they name, run the program on every test under the task's
# limits, and compare each run's output with that test's answer. Seeded by
# `uv run bootstrap` into the repository unicon/classic-folder.workflow at
# the forge, at the tag v1. The format is TASK-FORMAT.md section 1.3, and
# the workflow is section 4.7's.
inputs:
  program:
    type: folder
    contestant: true
    title: Program
    help: The folder of source files the contestant submits.
  language:
    type: enum
    options: [c, cpp, java, python]
    contestant: true
    title: Language
    help: The languages a contestant may write their program in.
  entry:
    type: text
    contestant: true
    title: Entry point
    help: The file in the program that runs first, such as main.py.
  time_limit:
    type: number
    title: Time limit
    unit: seconds
    help: The CPU time the program may use on each test.
  memory_limit:
    type: number
    title: Memory limit
    unit: MB
    help: The memory the program may use on each test.
test:
  input: file
  answer: file
steps:
  - id: compile
    use: unicon/compile@v2
    with:
      source: ${{ inputs.program }}
      entry: ${{ inputs.entry }}
      language: ${{ inputs.language }}
  - id: run
    use: unicon/sandbox-run@v2
    per_test: true
    with:
      binary: ${{ steps.compile.binary }}
      input: ${{ test.input }}
      time_limit: ${{ inputs.time_limit }}
      memory_limit: ${{ inputs.memory_limit }}
  - id: check
    use: unicon/diff-check@v2
    per_test: true
    with: {actual: "${{ steps.run.output }}", expected: "${{ test.answer }}"}
report:
  time_ms:
    from: ${{ steps.run.time_ms }}
    title: Run time
    unit: ms
    fold: max
    better: lower
    at_least: 0
  memory_kb:
    from: ${{ steps.run.memory_kb }}
    title: Memory used
    unit: KB
    fold: max
    better: lower
    at_least: 0
  log:
    from: ${{ steps.compile.compile_log }}
    title: Compile log
