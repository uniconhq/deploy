[project]
name = "unicon-deploy"
version = "0.14.0"
description = "Bootstrap and checks for the Unicon compose stack"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "ruamel-yaml==0.19.1",
]

[project.scripts]
bootstrap = "bootstrap.main:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "playwright==1.63.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "yamllint==1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bootstrap"]

[tool.ruff]
line-length = 88
target-version = "py314"
# The seed's entrants' programs are wrong on purpose, some of them not
# even Python a parser takes.
extend-exclude = ["devseed/programs"]
# The machine script runs on the grading machine's own Python, Ubuntu
# 24.04's 3.12.
per-file-target-version = { "machine/*.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["bootstrap", "devseed", "scripts", "tests", "machine"]
# The seed's data: entrants' programs, and checkers and judges run by the
# grading machine, as the workflows folder's are.
exclude = ["^devseed/(programs|contests|workflows)/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
