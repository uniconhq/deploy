# Local development override. Use it together with compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# It does four things: builds backend and frontend from the sibling checkouts
# instead of pulling images, publishes the internal services so tools on this
# machine can reach them, loosens Forgejo enough that a person can create an
# account without a mail server, and can run one CI agent on this machine
# under the `agent` profile.
#
# Every port opened here is bound to 127.0.0.1. A published port with no host
# address listens on every interface, so on a laptop joined to a conference
# network the database and the object store would be on that network too.
#
# Forgejo is at http://forge.localhost:8080 in a browser, through the proxy,
# the same as in production. Browsers and most resolvers answer any name under
# .localhost with loopback, so no hosts entry is needed.

services:
  postgres:
    # 55432, not 5432. A developer machine often already runs a PostgreSQL of
    # its own on 5432, and publishing this one there too does not fail: Windows
    # and Linux both let the second listener share the address, and then
    # `psql -h localhost` reaches whichever of the two answers first. A port
    # nothing else claims is the difference between a confusing result and a
    # connection refused.
    ports:
      - "127.0.0.1:55432:5432"

  garage:
    # Published for scripts/check-lfs.py, which runs on this machine. Bootstrap
    # needs neither port: it drives Garage through the container's own command
    # line. The admin API on 3903 is full control over the store, so in the
    # production shape it stays inside the network.
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"

  forgejo:
    # Loopback only, for scripts/check-lfs.py, which drives the API from this
    # machine. Nothing else uses it: the browser goes through the proxy, and
    # bootstrap drives the API from inside the container.
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      # Dev only. A production instance decides registration deliberately and
      # has a mailer, so neither of these belongs in the committed app.ini.
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__REGISTER_EMAIL_CONFIRM: "false"
      FORGEJO__service__REGISTER_MANUAL_CONFIRM: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__log__LEVEL: Info

  woodpecker-server:
    # The operator interface, and the URL bootstrap drives to mint the CI token.
    ports:
      - "127.0.0.1:8000:8000"
    # Woodpecker uses the public Forgejo URL for the whole OAuth exchange, the
    # server-side token request included, so forge.localhost has to mean
    # something inside this container too: the host, whose port 8080 is the
    # proxy. A deployment where Forgejo has a real name does not need this.
    extra_hosts:
      - "forge.localhost:host-gateway"

  # Same build and same tag as backend, so the image is built once and both
  # services run it.
  backend-migrate:
    build:
      context: ../backend
    image: unicon/backend:dev

  backend:
    build:
      context: ../backend
    image: unicon/backend:dev
    environment:
      # The other half of the Forgejo registration override above: Forgejo takes
      # sign-ups here, so the landing page may offer Create account.
      UNICON_FORGE_REGISTRATION_OPEN: "true"

  frontend:
    build:
      context: ../frontend
      # The Forgejo URL is baked into the bundle, for the account page links.
      args:
        VITE_FORGE_URL: "${FORGEJO_PUBLIC_URL}"
    image: unicon/frontend:dev

  # One CI agent on the laptop, beside the stack. This is the only place an
  # agent and the databases share a Docker daemon; a real grading machine is a
  # separate host. Off unless started with --profile agent, and it needs a
  # token the server issued: WOODPECKER_DEV_AGENT_TOKEN in .env, taken from
  # the CI's Agents page under the unicon-ci account.
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.18.1
    profiles: [agent]
    restart: unless-stopped
    depends_on:
      woodpecker-server:
        condition: service_healthy
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_DEV_AGENT_TOKEN}
      # Onto the volume below. The default path is /etc/woodpecker, which this
      # image does not create, so the agent cannot save the identity the server
      # gave it: every restart registers a new agent and leaves the old row
      # behind reporting nothing.
      WOODPECKER_AGENT_CONFIG_FILE: /var/lib/woodpecker/agent.conf
      WOODPECKER_MAX_WORKFLOWS: "4"
      WOODPECKER_BACKEND: docker
      WOODPECKER_LOG_LEVEL: info
    volumes:
      - woodpecker-agent-data:/var/lib/woodpecker
      # The agent starts sibling containers on the host daemon. Anything that
      # can reach this socket is root on the host.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  woodpecker-agent-data:
