# Local development override. Use it together with compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# It does four things: builds backend and frontend from the sibling checkouts
# instead of pulling images, publishes the internal services so tools on this
# machine can reach them, catches Forgejo's mail in Mailpit, so a person can
# make an account and confirm its address from http://localhost:8025, and
# runs the grading on this laptop with the app: one `unicon-base` runner and
# one `unicon-exec-<slot>` runner taking every slot size. Sign-up is open on a
# stack started with this file unless .env says SIGN_UP_OPEN=false;
# bootstrap decides it, not this file.
#
# Every port opened here is bound to 127.0.0.1. A published port with no host
# address listens on every interface, so on a laptop joined to a conference
# network the database and the object store would be on that network too.
#
# Forgejo is at http://forge.localhost:8080 in a browser, through the proxy,
# the same as in production. Browsers and most resolvers answer any name under
# .localhost with loopback, so no hosts entry is needed.

services:
  postgres:
    # 55432, not 5432. A developer machine often already runs a PostgreSQL of
    # its own on 5432, and publishing this one there too does not fail: Windows
    # and Linux both let the second listener share the address, and then
    # `psql -h localhost` reaches whichever of the two answers first. A port
    # nothing else claims is the difference between a confusing result and a
    # connection refused.
    ports:
      - "127.0.0.1:55432:5432"

  garage:
    # Published for scripts/check-lfs.py, which runs on this machine, and S3
    # for forge's live tests too. Bootstrap needs neither port: it drives
    # Garage through the container's own command line. The admin API on 3903
    # is full control over the store, so in the production shape it stays
    # inside the network.
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"

  forgejo:
    # Loopback only, for scripts/check-lfs.py and forge's live tests, which
    # drive the API from this machine. Nothing else uses it: the browser goes
    # through the proxy, and bootstrap drives the API from inside the
    # container.
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      # Dev only. A production instance sends mail through a server of its
      # own in .env. Here every mail goes to Mailpit, so an address is
      # confirmed the same way as in production, by the link in the mail.
      FORGEJO__service__REGISTER_MANUAL_CONFIRM: "false"
      FORGEJO__mailer__ENABLED: "true"
      # Plain SMTP to Mailpit, on the compose network and holding no password.
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: mailpit
      FORGEJO__mailer__SMTP_PORT: "1025"
      FORGEJO__mailer__USER: ""
      FORGEJO__mailer__PASSWD: ""
      FORGEJO__mailer__FROM: "Unicon <forgejo@forge.localhost>"
      FORGEJO__log__LEVEL: Info

  # Every mail Forgejo sends in development: sign-up confirmations and
  # password resets, read at http://localhost:8025. It delivers nothing.
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  proxy:
    # On the grading network too, where the runners' jobs reach the platform
    # at http://proxy.
    networks:
      - default
      - grading

  # Forgejo at its ROOT_URL for the runners and their jobs. Every job fetches
  # actions and checks out at the URL Forgejo knows itself by,
  # FORGEJO_PUBLIC_URL, which on a laptop is a .localhost name the proxy
  # serves only sign-in pages under. On the grading network that name is
  # this forwarder, which passes the port of that URL to Forgejo whole.
  # curl, and so git, answers every .localhost name with loopback without
  # asking DNS, so the runners also give git this forwarder as its HTTP
  # proxy; Forgejo answers a request for a whole URL as it would the path.
  forge-host:
    image: alpine/socat:1.8.0.3
    profiles: [app]
    restart: unless-stopped
    command:
      - TCP-LISTEN:${FORGEJO_PUBLIC_PORT},fork,reuseaddr
      - TCP:forgejo:3000
    networks:
      default:
      grading:
        aliases:
          - ${FORGEJO_DOMAIN}

  # Same build and same tag as backend, so the image is built once and both
  # services run it. The forge checkout beside it is handed to the build as
  # the named context `forge`: while the backend develops against ../forge by
  # path, that is where its forge package comes from; while it pins a
  # release, the package comes from the wheel and the copy goes unused.
  backend-migrate:
    build:
      context: ../backend
      additional_contexts:
        forge: ../forge
    image: unicon/backend:dev

  backend:
    build:
      context: ../backend
      additional_contexts:
        forge: ../forge
    image: unicon/backend:dev
    environment:
      # The runners' jobs join the grading network, where the proxy is, so a
      # job reaches the platform at the proxy's name on it. localhost would
      # be the job's container itself.
      UNICON_MACHINE_URL: http://proxy
      # Invite mail goes to Mailpit too, the way Forgejo's does above.
      UNICON_MAIL_SMTP_ADDR: mailpit
      UNICON_MAIL_SMTP_PORT: "1025"
      UNICON_MAIL_PROTOCOL: smtp
      UNICON_MAIL_SMTP_USER: ""
      UNICON_MAIL_SMTP_PASSWORD: ""
      UNICON_MAIL_FROM: "Unicon <unicon@forge.localhost>"

  frontend:
    build:
      context: ../frontend
    image: unicon/frontend:dev

  # The laptop's runners, registered at Forgejo by bootstrap, which writes
  # their tokens and labels to .env. They start the jobs on this machine's
  # Docker, on the grading network, which holds the proxy and the forwarder
  # and no other service of the stack. This is the only place runners and
  # the databases share a Docker daemon; a grading machine is a separate host
  # (machine/grading-machine.py). Dev only: a job reaches Forgejo's whole web
  # UI and API through forge-host, and on Docker Desktop also
  # host.docker.internal and every port this machine publishes.
  runner-base:
    image: data.forgejo.org/forgejo/runner:13.2.1
    profiles: [app]
    restart: unless-stopped
    user: "0"
    command: [forgejo-runner, daemon, --config, /etc/runner.yaml]
    # The runner clones the actions with git too.
    environment: &git-proxy
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.proxy
      GIT_CONFIG_VALUE_0: http://forge-host:${FORGEJO_PUBLIC_PORT}
    configs:
      - source: runner-base
        target: /etc/runner.yaml
    networks: [grading]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  runner-exec:
    image: data.forgejo.org/forgejo/runner:13.2.1
    profiles: [app]
    restart: unless-stopped
    user: "0"
    command: [forgejo-runner, daemon, --config, /etc/runner.yaml]
    environment: *git-proxy
    configs:
      - source: runner-exec
        target: /etc/runner.yaml
    networks: [grading]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  grading:

# The two runners' settings. A runner's timeout is below Forgejo's
# ENDLESS_TASK_TIMEOUT (3 h) and forge's wait for a machine (2 h). The cache
# server is off and a job gets no container options. Docker Desktop runs
# Docker as root, so exec is told it may run there (UNICON_DEV_ROOT_DOCKER);
# a grading machine is rootless and never is.
configs:
  runner-base:
    content: |
      log: {level: info, job_level: info}
      runner:
        capacity: 4
        timeout: 1h
        fetch_interval: 2s
        report_interval: 1s
        envs:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: http://forge-host:${FORGEJO_PUBLIC_PORT}
      cache: {enabled: false}
      container:
        network: ${COMPOSE_PROJECT_NAME}_grading
        privileged: false
        options: ""
        force_pull: false
        docker_host: "-"
      server:
        connections:
          forgejo:
            url: ${FORGEJO_PUBLIC_URL}/
            uuid: ${DEV_RUNNER_BASE_UUID}
            token: ${DEV_RUNNER_BASE_TOKEN}
            labels: ${DEV_RUNNER_BASE_LABELS:?set by bootstrap}
  runner-exec:
    content: |
      log: {level: info, job_level: info}
      runner:
        capacity: 1
        timeout: 1h
        fetch_interval: 2s
        report_interval: 1s
        envs:
          UNICON_BOX_USERS: "10000-10099"
          UNICON_CACHE_CAP_BYTES: "10737418240"
          UNICON_DEV_ROOT_DOCKER: "1"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: http://forge-host:${FORGEJO_PUBLIC_PORT}
      cache: {enabled: false}
      container:
        network: ${COMPOSE_PROJECT_NAME}_grading
        privileged: true
        options: ""
        valid_volumes: [unicon-cache]
        force_pull: false
        docker_host: "-"
      server:
        connections:
          forgejo:
            url: ${FORGEJO_PUBLIC_URL}/
            uuid: ${DEV_RUNNER_EXEC_UUID}
            token: ${DEV_RUNNER_EXEC_TOKEN}
            labels: ${DEV_RUNNER_EXEC_LABELS:?set by bootstrap}
